name: build

# Tests on every push and pull request; installers on main and version tags.
# A tag like v0.2.0 also drafts a GitHub release with the Windows installer
# and zip and the macOS universal dmg and zip attached.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Only the Windows run executes the generated command lines through the
      # Electron binary (Git Bash, cmd.exe, PowerShell); elsewhere skip the download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: ${{ matrix.os != 'windows-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The installers are named after package.json's version, so a tag has to match it.
      - name: Tag matches package.json version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

  windows:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --x64 --publish never
      - name: Smoke test the packaged app
        shell: bash
        run: |
          APP=dist/win-unpacked/claude-codex-cockpit.exe
          # The window starts its own server with the packaged runtime and renders.
          CLAUDE_CODEX_COCKPIT_HOME="$RUNNER_TEMP/cockpit-home" CLAUDE_CODEX_COCKPIT_PORT=47899 \
          CLAUDE_CODEX_COCKPIT_SCREENSHOT="$RUNNER_TEMP/windows.png" CLAUDE_CODEX_COCKPIT_SCREENSHOT_SIZE=380x560 "$APP"
          test -s "$RUNNER_TEMP/windows.png"
          # The statusline runs on the app's own binary, the way connections set it up.
          OUT=$(printf '%s' '{"session_id":"ci","model":{"display_name":"CI"},"context_window":{"used_percentage":1}}' \
            | CLAUDE_CODEX_COCKPIT_HOME="$RUNNER_TEMP/cockpit-home" NO_COLOR=1 ELECTRON_RUN_AS_NODE=1 "$APP" dist/win-unpacked/resources/app/bin/statusline.js)
          test "$OUT" = "CI · ctx 1%"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-screenshot
          path: ${{ runner.temp }}/windows.png
          if-no-files-found: ignore

  mac:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APP: dist/mac-universal/Claude Codex Cockpit.app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the universal app (x64 + arm64)
        run: npx electron-builder --mac --universal --dir --publish never
      # There is no Developer ID here, and Apple Silicon won't run code that has
      # no signature at all, so the app gets an ad-hoc signature.
      - name: Ad-hoc sign
        run: |
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/Claude Codex Cockpit"
      - name: Smoke test the packaged app
        run: |
          BIN="$APP/Contents/MacOS/Claude Codex Cockpit"
          CLAUDE_CODEX_COCKPIT_HOME="$RUNNER_TEMP/cockpit-home" CLAUDE_CODEX_COCKPIT_PORT=47899 \
          CLAUDE_CODEX_COCKPIT_SCREENSHOT="$RUNNER_TEMP/mac.png" CLAUDE_CODEX_COCKPIT_SCREENSHOT_SIZE=380x560 "$BIN"
          test -s "$RUNNER_TEMP/mac.png"
          OUT=$(printf '%s' '{"session_id":"ci","model":{"display_name":"CI"},"context_window":{"used_percentage":1}}' \
            | CLAUDE_CODEX_COCKPIT_HOME="$RUNNER_TEMP/cockpit-home" NO_COLOR=1 ELECTRON_RUN_AS_NODE=1 "$BIN" "$APP/Contents/Resources/app/bin/statusline.js")
          test "$OUT" = "CI · ctx 1%"
      - name: Package the signed app as dmg and zip
        run: npx electron-builder --mac --universal --prepackaged "$APP" --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-screenshot
          path: ${{ runner.temp }}/mac.png
          if-no-files-found: ignore

  release:
    needs: [windows, mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: '{windows,mac}'
      # A new tag gets a draft release to review and publish. If a release for the
      # tag already exists (made by hand, or a re-run), the files are replaced on it.
      - name: Draft the release, or attach to the existing one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber artifacts/windows/* artifacts/mac/*
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
              --title "Claude Codex Cockpit $GITHUB_REF_NAME" artifacts/windows/* artifacts/mac/*
          fi
